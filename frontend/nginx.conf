server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container. The frontend code calls
    # relative paths like `/api/auth/login` (see src/lib/api.ts), so this
    # is what makes those calls reach the backend when the app is served
    # as a static production build (docker-compose / `docker build`).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routes (e.g. /login, /opportunities)
    # don't 404 on a hard refresh or direct URL navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
